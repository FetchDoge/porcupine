[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "porcupine"
version = "1.0.0"
description = "Read-only radar for Canada's defence and dual-use tender market"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.scripts]
porcupine = "porcupine.cli:main"

[tool.setuptools]
packages = ["porcupine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
